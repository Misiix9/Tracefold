[[permission]]
identifier = "workspace-repository"
description = "Project-scoped offline repository. File export uses a Rust-owned native save dialog; plugin packages use application-owned storage and loopback-only runtimes."
commands.allow = ["list_projects", "save_project", "list_records", "get_record", "save_record", "delete_record", "restore_record", "get_revisions", "get_settings", "save_settings", "import_asset", "read_asset", "capture_capabilities", "capture_screen", "save_file", "create_backup", "list_backups", "restore_backup", "export_backup_file", "restore_backup_file", "storage_info", "import_project", "list_plugins", "install_plugin_from_file", "fetch_plugin_catalog", "install_catalog_plugin", "set_plugin_enabled", "remove_plugin", "stop_plugin", "start_plugin", "launch_plugin"]
